<!DOCTYPE html>
<html lang="en" hidden>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Discharge Dashboard - Launch</title>
</head>
<body>
  <p>Launching app, please wait...</p>

  <!--
    fhir-client.js handles the full SMART on FHIR OAuth2 launch sequence:
      1. Reads  ?iss=  and  ?launch=  query params injected by Cerner
      2. Fetches the FHIR server's metadata to discover the authorization URL
      3. Redirects to the auth server with client_id, scopes, and launch context
  -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  <script>
    FHIR.oauth2.authorize({
      // ── STEP 1 ──────────────────────────────────────────────────────────
      // Registered on Oracle Health Code Console (code-console.cerner.com)
      // Application ID: 28becaff-9234-48b8-8895-45b9648d6343
      client_id: "87ffc00b-db23-430c-a7e2-a8babbdcc16c",

      // ── STEP 2 ──────────────────────────────────────────────────────────
      // Scopes tell Cerner exactly what data your app is allowed to read.
      // - patient/Patient.read       → read the current patient's demographics
      // - patient/Observation.read   → read vitals, lab results
      // - patient/Condition.read     → read diagnoses
      // - patient/MedicationRequest.read → read prescriptions
      // - patient/DiagnosticReport.read  → read lab & radiology reports
      // - launch                     → required for EHR-embedded launch
      // - openid profile             → get logged-in user identity
      // - online_access              → keep session alive while user is online
      // SMART v2 granular scopes: format is user/Resource.cs where
      // c = create, r = read, u = update, d = delete, s = search
      scope: [
        "user/Patient.rs",
        "user/Observation.rs",
        "user/Condition.rs",
        "user/MedicationRequest.rs",
        "user/DiagnosticReport.rs",
        "user/Encounter.rs",
        "user/DocumentReference.rs",
        "launch",
        "openid",
        "fhirUser",
        "profile",
        "online_access"
      ].join(" ")
    });
  </script>
</body>
</html>
